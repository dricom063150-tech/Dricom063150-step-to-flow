name: tests
on: [push, pull_request]
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Tests du moteur (cotes vs valeurs connues)
        run: node --test tests/engine.test.js
      - name: Le fichier dist/ est à jour avec src/
        run: python3 build.py && git diff --exit-code dist/
